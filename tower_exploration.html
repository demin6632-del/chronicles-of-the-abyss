<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b14"><title>Хроники Бездны — Исследование</title><style>html,body{margin:0;width:100%;height:100%;background:#080b14;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080b14}#explore{position:fixed;inset:0;background:rgba(4,7,13,.96);color:#eef2ff;display:none;overflow:auto;padding:14px 10px 24px;z-index:20}#explore.show{display:block}#panel{max-width:520px;margin:auto}.card{background:linear-gradient(180deg,#111827,#0c121e);border:1px solid #26334d;border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.2)}h1,h2,h3{margin:0 0 8px}.muted{color:#8d99b5}.small{font-size:12px}.btn{width:100%;background:#182238;border:1px solid #30405f;border-radius:12px;padding:11px 10px;margin:5px 0;color:#eef2ff;font:inherit;font-weight:700;text-align:left}.primary{background:#39266b;border-color:#7655c9}.good{background:#143324;border-color:#2c6d4b}.danger{background:#3b1825;border-color:#743348}.rooms{display:grid;grid-template-columns:1fr 1fr;gap:7px}.room{min-height:92px;background:#0c1421;border:1px solid #26334d;border-radius:12px;padding:10px;color:#eef2ff;text-align:left}.room b{display:block;margin-bottom:5px}.result{border-left:3px solid #7655c9;background:#0b111d;border-radius:8px;padding:9px;margin-top:8px;font-size:12px;line-height:1.45}.status{display:flex;justify-content:space-between;gap:8px;font-size:12px}.topbtn{position:fixed;right:10px;bottom:12px;z-index:15;width:auto;padding:10px 13px;border-radius:12px;background:#39266b;border:1px solid #7655c9;color:#fff;font:inherit;font-weight:800}.hidden{display:none}</style></head><body><iframe id="game" src="tower_game.html" title="Хроники Бездны"></iframe><button id="exploreBtn" class="topbtn hidden" onclick="openExplore()">🗺️ Исследовать этаж</button><div id="explore"><div id="panel"><div class="card"><h1>🗺️ Исследование этажа</h1><div id="floorInfo" class="status"></div><p class="muted small">Каждый этаж теперь можно осмотреть до перехода дальше. Исследуй комнаты, находи награды и события. Некоторые комнаты охраняются врагами.</p></div><div id="rooms" class="rooms"></div><div id="result" class="result hidden"></div><button class="btn primary" onclick="closeExplore()">↩️ Вернуться к Башне</button></div></div><script>'use strict';const frame=document.getElementById('game'),overlay=document.getElementById('explore'),roomsEl=document.getElementById('rooms'),resultEl=document.getElementById('result'),floorInfo=document.getElementById('floorInfo'),exploreBtn=document.getElementById('exploreBtn');const EXKEY='chronicles_tower_exploration_v1';let ex={floor:0,rooms:[],searched:0};const ROOM_TYPES=[['🕯️','Тёмный коридор','Внимательно осмотреть стены и пол.'],['📦','Заброшенная кладовая','Проверить старые сундуки и ящики.'],['⛩️','Святилище','Исследовать странный алтарь.'],['🕳️','Трещина Бездны','Заглянуть в разлом, откуда идёт холод.'],['🗝️','Запечатанная дверь','Попытаться понять, что находится за дверью.'],['👁️','Зал стража','В комнате чувствуется присутствие врага.']];function game(){return frame.contentWindow}function saveEx(){localStorage.setItem(EXKEY,JSON.stringify(ex))}function loadEx(){try{let x=JSON.parse(localStorage.getItem(EXKEY));if(x)ex=x}catch(e){}}function currentFloor(){try{return game().state&&game().state.hero?game().state.floor:0}catch(e){return 0}}function canExplore(){try{return !!(game().state&&game().state.hero&&game().state.screen==='tower'&&game().state.floor<=50)}catch(e){return false}}function sync(){if(canExplore())exploreBtn.classList.remove('hidden');else exploreBtn.classList.add('hidden')}function openExplore(){if(!canExplore())return;let f=currentFloor();if(ex.floor!==f||!Array.isArray(ex.rooms)||!ex.rooms.length){ex.floor=f;ex.searched=0;ex.rooms=ROOM_TYPES.slice().sort(()=>Math.random()-.5).slice(0,4).map((r,i)=>({id:i,title:r[0]+' '+r[1],desc:r[2],done:false}));saveEx()}renderRooms();overlay.classList.add('show');exploreBtn.classList.add('hidden')}function closeExplore(){overlay.classList.remove('show');sync()}function renderRooms(){let f=currentFloor();floorInfo.innerHTML='<span>🏰 Этаж <b>'+f+'</b></span><span>🔎 Исследовано: <b>'+ex.searched+'/'+ex.rooms.length+'</b></span>';roomsEl.innerHTML=ex.rooms.map((r,i)=>'<button class="room" '+(r.done?'disabled':'')+' onclick="searchRoom('+i+')"><b>'+r.title+(r.done?' ✅':'')+'</b><span class="small muted">'+(r.done?'Уже исследовано.':r.desc)+'</span></button>').join('');if(ex.searched>=ex.rooms.length){roomsEl.insertAdjacentHTML('afterend','<button class="btn good" onclick="startFloorEncounter()">⚔️ Закончить исследование и столкнуться с охраной этажа</button>')}}function showResult(t){resultEl.classList.remove('hidden');resultEl.innerHTML=t}function searchRoom(i){let r=ex.rooms[i];if(!r||r.done)return;r.done=true;ex.searched++;let roll=Math.random();let h=game().state.hero;let text='';if(roll<.22){let gold=8+Math.floor(Math.random()*18)+currentFloor();h.gold+=gold;text='🪙 Ты находишь тайник с '+gold+' золотыми монетами.'}else if(roll<.40){let heal=Math.max(8,Math.floor((h.baseHp+h.level*8)*.12));h.hp=Math.min(game().maxHp(),h.hp+heal);text='💚 В святилище найдено лекарство. Восстановлено '+heal+' HP.'}else if(roll<.55){let xp=12+currentFloor()*2;game().gainXP(xp);text='⭐ Древняя надпись дарует '+xp+' XP.'}else if(roll<.72){let dmg=Math.max(1,4+Math.floor(currentFloor()/3)-game().def());h.hp-=dmg;if(h.hp<1)h.hp=1;text='⚠️ Ловушка! Ты получаешь '+dmg+' урона.'}else if(roll<.88){h.potions++;text='🧪 В тайнике найдено зелье.'}else{text='👁️ Ты чувствуешь, что за стеной кто-то наблюдает. Следует быть осторожнее.'}saveEx();game().save();showResult(text);renderRooms()}function startFloorEncounter(){closeExplore();try{game().enterFloor()}catch(e){}}frame.addEventListener('load',()=>{loadEx();sync();setInterval(sync,700)});loadEx();setInterval(sync,700);</script></body></html>
