plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pokoritel.bashni'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pokoritel.bashni'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            // Подпись Release подключается GitHub Actions из защищённых Secrets.
            // Если Secrets ещё не заданы, workflow остановится до публикации APK,
            // чтобы случайно не выпустить APK с неподходящим ключом.
            minifyEnabled false
            shrinkResources false
        }
    }
}
