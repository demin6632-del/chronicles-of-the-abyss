plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pokoritel.bashni'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pokoritel.bashni'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '4.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def storePath = project.findProperty('RELEASE_STORE_FILE')
            def storePass = project.findProperty('RELEASE_STORE_PASSWORD')
            def keyAliasValue = project.findProperty('RELEASE_KEY_ALIAS')
            def keyPass = project.findProperty('RELEASE_KEY_PASSWORD')
            if (storePath && storePass && keyAliasValue && keyPass) {
                storeFile = file(storePath)
                storePassword = storePass
                keyAlias = keyAliasValue
                keyPassword = keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}
