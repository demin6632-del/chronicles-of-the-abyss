name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Package the single final game source
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        run: |
          mkdir -p app/src/main/assets
          cp ../game.html app/src/main/assets/game.html
          test -s app/src/main/assets/game.html
          ! grep -q "chronicles_tower_save_v3" app/src/main/assets/game.html
          grep -q "New Game+" app/src/main/assets/game.html
          grep -q "Бесконечная Бездна" app/src/main/assets/game.html
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > Pokoritel_Bashni_Offline_Deluxe_1.7.1/release.keystore
          else
            echo "Signing secrets are not configured; generating a temporary installable release keystore."
            KEYSTORE_PASSWORD='local-release-password'
            KEY_ALIAS='chronicles-release'
            KEY_PASSWORD='local-release-password'
            keytool -genkeypair -v -keystore Pokoritel_Bashni_Offline_Deluxe_1.7.1/release.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Chronicles of the Abyss, OU=Game, O=Chronicles, L=Unknown, S=Unknown, C=DE"
          fi
          test -s Pokoritel_Bashni_Offline_Deluxe_1.7.1/release.keystore
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed Release APK
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        run: |
          gradle --no-daemon clean assembleRelease             -PRELEASE_STORE_FILE=release.keystore             -PRELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"             -PRELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS"             -PRELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"             --stacktrace
      - name: Verify APK signature and output
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Prepare APK
        run: |
          cp Pokoritel_Bashni_Offline_Deluxe_1.7.1/app/build/outputs/apk/release/app-release.apk ChroniclesOfTheAbyss.apk
          sha256sum ChroniclesOfTheAbyss.apk > ChroniclesOfTheAbyss.apk.sha256
      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-Release
          path: |
            ChroniclesOfTheAbyss.apk
            ChroniclesOfTheAbyss.apk.sha256
      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ChroniclesOfTheAbyss.apk
            ChroniclesOfTheAbyss.apk.sha256

# Final release CI trigger: verify signed APK path
