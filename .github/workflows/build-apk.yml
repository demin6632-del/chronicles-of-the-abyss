name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare game asset
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        run: |
          mkdir -p app/src/main/assets
          cp ../game.html app/src/main/assets/game.html

      - name: Check release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > Pokoritel_Bashni_Offline_Deluxe_1.7.1/release.keystore
          test -s Pokoritel_Bashni_Offline_Deluxe_1.7.1/release.keystore

      - name: Build signed Release APK
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Verify APK signature and output
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: |
          cp Pokoritel_Bashni_Offline_Deluxe_1.7.1/app/build/outputs/apk/release/app-release.apk ChroniclesOfTheAbyss.apk
          sha256sum ChroniclesOfTheAbyss.apk > ChroniclesOfTheAbyss.apk.sha256

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-Release
          path: |
            ChroniclesOfTheAbyss.apk
            ChroniclesOfTheAbyss.apk.sha256

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ChroniclesOfTheAbyss.apk
            ChroniclesOfTheAbyss.apk.sha256
