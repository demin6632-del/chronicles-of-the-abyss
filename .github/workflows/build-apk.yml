name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Gradle wrapper
        run: |
          find . -name gradlew -print

      - name: Build debug APK
        run: |
          GRADLEW=$(find . -name gradlew | head -n 1)
          chmod +x "$GRADLEW"
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find . -path '*build/outputs/apk/debug/app-debug.apk' | head -n 1)
          cp "$APK" ChroniclesOfTheAbyss.apk
          sha256sum ChroniclesOfTheAbyss.apk > ChroniclesOfTheAbyss.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-Release
          path: |
            ChroniclesOfTheAbyss.apk
            ChroniclesOfTheAbyss.apk.sha256
