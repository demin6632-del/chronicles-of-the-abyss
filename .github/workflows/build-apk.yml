name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../ChroniclesOfTheAbyss.apk
          sha256sum ../ChroniclesOfTheAbyss.apk > ../ChroniclesOfTheAbyss.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-Release
          path: |
            ChroniclesOfTheAbyss.apk
            ChroniclesOfTheAbyss.apk.sha256
