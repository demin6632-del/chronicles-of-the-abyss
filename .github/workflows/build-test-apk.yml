name: Build Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare existing game and integrate exploration
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        run: |
          mkdir -p app/src/main/assets
          cp ../tower_game.html app/src/main/assets/game.html
          python - <<'PY'
          from pathlib import Path
          game = Path('app/src/main/assets/game.html')
          patch = Path('../tower_exploration_patch.js').read_text(encoding='utf-8')
          boss_fix = Path('../tower_exploration_boss_fix.js').read_text(encoding='utf-8')
          fog = Path('../tower_exploration_fog_v1.js').read_text(encoding='utf-8')
          html = game.read_text(encoding='utf-8')
          html = html.replace('</body>', '<script>\n' + patch + '\n' + boss_fix + '\n' + fog + '\n</script></body>')
          game.write_text(html, encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare test APK
        run: |
          cp Pokoritel_Bashni_Offline_Deluxe_1.7.1/app/build/outputs/apk/debug/app-debug.apk ChroniclesOfTheAbyss-test.apk
          sha256sum ChroniclesOfTheAbyss-test.apk > ChroniclesOfTheAbyss-test.apk.sha256

      - name: Verify APK exists
        run: test -s ChroniclesOfTheAbyss-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-Test
          path: |
            ChroniclesOfTheAbyss-test.apk
            ChroniclesOfTheAbyss-test.apk.sha256

      - name: Create complete project ZIP
        run: |
          rm -rf ChroniclesOfTheAbyss_PROJECT
          mkdir -p ChroniclesOfTheAbyss_PROJECT/APK
          cp ChroniclesOfTheAbyss-test.apk ChroniclesOfTheAbyss_PROJECT/APK/
          cp ChroniclesOfTheAbyss-test.apk.sha256 ChroniclesOfTheAbyss_PROJECT/APK/
          rsync -a --exclude='.git/' --exclude='*/build/' --exclude='ChroniclesOfTheAbyss_PROJECT/' ./ ChroniclesOfTheAbyss_PROJECT/
          zip -qr ChroniclesOfTheAbyss_PROJECT.zip ChroniclesOfTheAbyss_PROJECT
          unzip -t ChroniclesOfTheAbyss_PROJECT.zip
          test -s ChroniclesOfTheAbyss_PROJECT.zip

      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-PROJECT
          path: ChroniclesOfTheAbyss_PROJECT.zip

# Сборка использует существующую игру tower_game.html и внедряет исследование этажей поверх неё.
# Отдельно создаётся проверенный ZIP всего проекта с текущей APK.