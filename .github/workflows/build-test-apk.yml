name: Build Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare tower game assets
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        run: |
          mkdir -p app/src/main/assets
          cp ../tower_game.html app/src/main/assets/tower_game.html
          cp ../tower_exploration.html app/src/main/assets/game.html

      - name: Build debug APK
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare test APK
        run: |
          cp Pokoritel_Bashni_Offline_Deluxe_1.7.1/app/build/outputs/apk/debug/app-debug.apk ChroniclesOfTheAbyss-test.apk
          sha256sum ChroniclesOfTheAbyss-test.apk > ChroniclesOfTheAbyss-test.apk.sha256

      - name: Verify APK exists
        run: test -s ChroniclesOfTheAbyss-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-Test
          path: |
            ChroniclesOfTheAbyss-test.apk
            ChroniclesOfTheAbyss-test.apk.sha256

# Техническая сборка APK с исследованием этажей Башни.
