name: Build Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Package the single final game source
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        run: |
          mkdir -p app/src/main/assets
          cp ../game.html app/src/main/assets/game.html
          test -s app/src/main/assets/game.html
          ! grep -q "chronicles_tower_save_v3" app/src/main/assets/game.html
          grep -q "New Game+" app/src/main/assets/game.html
          grep -q "Бесконечная Бездна" app/src/main/assets/game.html
      - name: Build debug APK
        working-directory: Pokoritel_Bashni_Offline_Deluxe_1.7.1
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Prepare test APK
        run: |
          cp Pokoritel_Bashni_Offline_Deluxe_1.7.1/app/build/outputs/apk/debug/app-debug.apk ChroniclesOfTheAbyss-test.apk
          sha256sum ChroniclesOfTheAbyss-test.apk > ChroniclesOfTheAbyss-test.apk.sha256
      - name: Verify test APK
        run: |
          test -s ChroniclesOfTheAbyss-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ChroniclesOfTheAbyss-test.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-Test
          path: |
            ChroniclesOfTheAbyss-test.apk
            ChroniclesOfTheAbyss-test.apk.sha256
      - name: Create complete project ZIP
        run: |
          rm -rf ChroniclesOfTheAbyss_PROJECT
          mkdir -p ChroniclesOfTheAbyss_PROJECT/APK
          cp ChroniclesOfTheAbyss-test.apk ChroniclesOfTheAbyss_PROJECT/APK/
          cp ChroniclesOfTheAbyss-test.apk.sha256 ChroniclesOfTheAbyss_PROJECT/APK/
          rsync -a --exclude='.git/' --exclude='*/build/' --exclude='ChroniclesOfTheAbyss_PROJECT/' ./ ChroniclesOfTheAbyss_PROJECT/
          zip -qr ChroniclesOfTheAbyss_PROJECT.zip ChroniclesOfTheAbyss_PROJECT
          unzip -t ChroniclesOfTheAbyss_PROJECT.zip
          test -s ChroniclesOfTheAbyss_PROJECT.zip
      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheAbyss-PROJECT
          path: ChroniclesOfTheAbyss_PROJECT.zip
